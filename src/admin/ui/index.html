<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NodeStack — Admin Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="/_/icon.svg">
  <link rel="alternate icon" href="/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0c0e14;
      --bg-card: #151821;
      --bg-card-hover: #1b1f2b;
      --bg-input: #1b1f2b;
      --border-subtle: #242938;
      --border-accent: #3b82f6;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent-primary: #3b82f6;
      --accent-primary-hover: #2563eb;
      --accent-success: #10b981;
      --accent-danger: #ef4444;
      --accent-warning: #f59e0b;
      --font-main: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-main);
      background-color: var(--bg-main);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      overflow: hidden;
      font-size: 14px;
    }

    /* Layout */
    #app { display: flex; width: 100%; height: 100%; }
    .sidebar {
      width: 260px;
      background-color: var(--bg-card);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-main);
      overflow: hidden;
    }

    /* Sidebar Components */
    .brand {
      padding: 1.25rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-subtle);
    }
    .brand-logo {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: -0.02em;
    }
    .brand-icon {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 800;
      font-size: 14px;
    }
    .version-tag {
      font-size: 11px;
      background: var(--bg-input);
      padding: 2px 6px;
      border-radius: 4px;
      color: var(--text-muted);
      font-family: var(--font-mono);
      border: 1px solid var(--border-subtle);
    }

    .sidebar-section {
      padding: 1rem 1rem 0.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .collections-list {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .collection-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.6rem 0.75rem;
      border-radius: 6px;
      color: var(--text-muted);
      cursor: pointer;
      font-weight: 500;
      transition: all 0.15s ease;
    }
    .collection-item:hover {
      background-color: var(--bg-card-hover);
      color: var(--text-main);
    }
    .collection-item.active {
      background-color: #1e293b;
      color: #60a5fa;
      font-weight: 600;
    }
    .collection-badge {
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.07);
    }

    .sidebar-bottom {
      padding: 1rem;
      border-top: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .sidebar-nav-item {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.55rem 0.75rem;
      border-radius: 6px;
      color: var(--text-muted);
      cursor: pointer;
      font-weight: 500;
      transition: all 0.15s ease;
    }
    .sidebar-nav-item:hover {
      background-color: var(--bg-card-hover);
      color: var(--text-main);
    }
    .sidebar-nav-item.active {
      background-color: #1e293b;
      color: #60a5fa;
    }

    /* Top Bar */
    .top-bar {
      height: 60px;
      border-bottom: 1px solid var(--border-subtle);
      background-color: var(--bg-card);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.5rem;
    }
    .page-title-box {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .page-title {
      font-size: 1.15rem;
      font-weight: 700;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      font-family: var(--font-main);
      font-size: 13px;
      font-weight: 600;
      padding: 0.5rem 0.9rem;
      border-radius: 6px;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.15s ease;
    }
    .btn-primary {
      background-color: var(--accent-primary);
      color: white;
    }
    .btn-primary:hover {
      background-color: var(--accent-primary-hover);
    }
    .btn-secondary {
      background-color: var(--bg-card-hover);
      border-color: var(--border-subtle);
      color: var(--text-main);
    }
    .btn-secondary:hover {
      background-color: #242938;
    }
    .btn-danger {
      background-color: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.3);
      color: #f87171;
    }
    .btn-danger:hover {
      background-color: rgba(239, 68, 68, 0.25);
    }
    .btn-sm {
      padding: 0.35rem 0.65rem;
      font-size: 12px;
    }

    /* Content Area & Tabs */
    .tabs-bar {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      padding: 0 1.5rem;
      border-bottom: 1px solid var(--border-subtle);
      background-color: var(--bg-card);
    }
    .tab-btn {
      padding: 0.75rem 0;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      position: relative;
      border: none;
      background: none;
      font-size: 13px;
    }
    .tab-btn:hover { color: var(--text-main); }
    .tab-btn.active {
      color: var(--accent-primary);
    }
    .tab-btn.active::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      right: 0;
      height: 2px;
      background-color: var(--accent-primary);
    }

    .content-body {
      flex: 1;
      padding: 1.5rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    /* Search and Controls */
    .controls-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
      gap: 1rem;
    }
    .search-input-box {
      position: relative;
      flex: 1;
      max-width: 380px;
    }
    .search-input {
      width: 100%;
      background-color: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 0.5rem 0.75rem 0.5rem 2rem;
      color: var(--text-main);
      font-size: 13px;
      outline: none;
    }
    .search-input:focus {
      border-color: var(--accent-primary);
    }
    .search-icon {
      position: absolute;
      left: 0.65rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    /* Data Table */
    .table-container {
      background-color: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      overflow: auto;
      flex: 1;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    th {
      background-color: #11141d;
      padding: 0.75rem 1rem;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-subtle);
      white-space: nowrap;
    }
    td {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border-subtle);
      font-size: 13px;
      white-space: nowrap;
      max-width: 250px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background-color: var(--bg-card-hover); }

    .id-pill {
      font-family: var(--font-mono);
      font-size: 11px;
      background-color: rgba(255, 255, 255, 0.05);
      padding: 2px 6px;
      border-radius: 4px;
      color: #93c5fd;
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }
    .modal {
      background-color: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      width: 100%;
      max-width: 580px;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .modal-header {
      padding: 1.25rem 1.5rem;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-title { font-size: 1.1rem; font-weight: 700; }
    .modal-body {
      padding: 1.5rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .modal-footer {
      padding: 1rem 1.5rem;
      border-top: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 0.75rem;
    }

    /* Form Inputs */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }
    .form-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
    }
    .form-input, .form-select, .form-textarea {
      background-color: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 0.6rem 0.75rem;
      color: var(--text-main);
      font-size: 13px;
      outline: none;
      font-family: var(--font-main);
    }
    .form-textarea {
      font-family: var(--font-mono);
      min-height: 100px;
      resize: vertical;
    }
    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: var(--accent-primary);
    }

    /* Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge-get { background: rgba(16, 185, 129, 0.15); color: #34d399; }
    .badge-post { background: rgba(59, 130, 246, 0.15); color: #60a5fa; }
    .badge-patch { background: rgba(245, 158, 11, 0.15); color: #fbbf24; }
    .badge-delete { background: rgba(239, 68, 68, 0.15); color: #f87171; }
    .badge-status-200 { background: rgba(16, 185, 129, 0.15); color: #34d399; }
    .badge-status-400 { background: rgba(245, 158, 11, 0.15); color: #fbbf24; }
    .badge-status-500 { background: rgba(239, 68, 68, 0.15); color: #f87171; }

    /* Modal sizes */
    .modal-lg {
      max-width: 840px !important;
      width: 95% !important;
    }

    /* Dropzone */
    .dropzone {
      border: 2px dashed var(--border-subtle);
      border-radius: 8px;
      padding: 2.25rem 1.5rem;
      text-align: center;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.02);
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
    }
    .dropzone:hover, .dropzone.dragover {
      border-color: var(--accent-primary);
      background: rgba(59, 130, 246, 0.08);
    }

    /* Dropdown */
    .dropdown-wrapper {
      position: relative;
      display: inline-block;
    }
    .dropdown-menu-item {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      width: 100%;
      padding: 0.55rem 0.9rem;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-main);
      background: transparent;
      border: none;
      cursor: pointer;
      text-align: left;
      transition: background 0.15s ease;
    }
    .dropdown-menu-item:hover {
      background: var(--bg-card-hover);
      color: #60a5fa;
    }

    /* Mapping Table */
    .mapping-table-container {
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      overflow: hidden;
      background: var(--bg-input);
    }
    .mapping-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    .mapping-table th {
      background: #11141d;
      padding: 0.65rem 0.85rem;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-subtle);
    }
    .mapping-table td {
      padding: 0.65rem 0.85rem;
      border-bottom: 1px solid var(--border-subtle);
      font-size: 13px;
      vertical-align: middle;
    }
    .mapping-table tr:last-child td {
      border-bottom: none;
    }

    .code-badge {
      font-family: var(--font-mono);
      font-size: 11px;
      background: rgba(255, 255, 255, 0.06);
      padding: 2px 6px;
      border-radius: 4px;
      color: #93c5fd;
      border: 1px solid rgba(255, 255, 255, 0.08);
      max-width: 220px;
      display: inline-block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Live indicator */
    .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--accent-success);
      display: inline-block;
      box-shadow: 0 0 6px var(--accent-success);
    }

    /* Toast */
    #toast-container {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      z-index: 9999;
    }
    .toast {
      background-color: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 0.75rem 1rem;
      font-size: 13px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      gap: 0.6rem;
      animation: slideIn 0.2s ease;
    }
    .toast.success { border-left: 3px solid var(--accent-success); }
    .toast.error { border-left: 3px solid var(--accent-danger); }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  </style>
</head>
<body>
  <div id="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo" onclick="selectNav('home')" style="cursor: pointer;" title="Go to Dashboard Overview">
          <div class="brand-icon" style="background: transparent; padding: 0;">
            <img src="/_/icon.svg" width="28" height="28" alt="NodeStack" style="display: block; border-radius: 6px;" />
          </div>
          <span>NodeStack</span>
        </div>
        <span class="version-tag">v0.1.0</span>
      </div>

      <div style="padding: 0.75rem 1rem 0.25rem;">
        <div class="sidebar-nav-item active" id="nav-home" onclick="selectNav('home')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
          <span>Dashboard Overview</span>
        </div>
      </div>

      <div class="sidebar-section">
        <span>Collections</span>
        <button class="btn btn-secondary btn-sm" onclick="openNewCollectionModal()">+ New</button>
      </div>

      <div class="collections-list" id="collections-list">
        <!-- Rendered dynamically -->
      </div>

      <div class="sidebar-bottom">
        <a href="/_/docs" target="_blank" class="sidebar-nav-item" id="nav-docs" style="text-decoration: none; color: inherit;" title="Interactive OpenAPI 3.0 Reference">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
          <span>API Docs (OpenAPI)</span>
          <span style="margin-left: auto; font-size: 11px; opacity: 0.6; color: var(--accent-primary);">↗</span>
        </a>
        <div class="sidebar-nav-item" id="nav-logs" onclick="selectNav('logs')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
          <span>Logs & Traffic</span>
        </div>
        <div class="sidebar-nav-item" id="nav-settings" onclick="selectNav('settings')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span>System & Settings</span>
        </div>
        <div class="sidebar-nav-item" onclick="logout()" style="margin-top: 0.5rem; border-top: 1px solid var(--border-subtle); padding-top: 0.75rem;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
          <span id="admin-user-email">Logout</span>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Top Bar -->
      <div class="top-bar">
        <div class="page-title-box">
          <h1 class="page-title" id="view-title">Collections</h1>
          <span class="badge" id="view-badge" style="display:none;"></span>
          <div style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-muted); margin-left: 1rem;">
            <span class="live-dot"></span>
            <span>Realtime Live</span>
          </div>
        </div>
        <div class="top-actions" id="view-actions">
          <!-- Dynamic Action Buttons -->
        </div>
      </div>

      <!-- Collection Tabs (shown only for collections) -->
      <div class="tabs-bar" id="collection-tabs" style="display:none;">
        <button class="tab-btn active" id="tab-records" onclick="switchCollectionTab('records')">Records Data Grid</button>
        <button class="tab-btn" id="tab-schema" onclick="switchCollectionTab('schema')">Schema & API Rules</button>
      </div>

      <!-- Main Body -->
      <div class="content-body" id="main-body">
        <!-- Dynamic Content injected by JS -->
      </div>
    </main>
  </div>

  <!-- Toast Container -->
  <div id="toast-container"></div>

  <!-- Modals Container -->
  <div id="modal-root"></div>

  <script>
    // State
    const state = {
      token: localStorage.getItem('nodestack_token') || localStorage.getItem('nb_token') || '',
      admin: JSON.parse(localStorage.getItem('nodestack_admin') || localStorage.getItem('nb_admin') || 'null'),
      collections: [],
      activeCollection: null,
      activeNav: 'collection', // 'collection' | 'logs' | 'settings'
      collectionTab: 'records', // 'records' | 'schema'
      records: [],
      recordsPage: 1,
      recordsPerPage: 30,
      recordsTotal: 0,
      recordsFilter: '',
      realtimeEventSource: null,
      logs: [],
    };

    // Initialize
    async function init() {
      // 1. Check if admins exist
      try {
        const res = await fetch('/api/admins/has-admins');
        const data = await res.json();
        if (!data.hasAdmins) {
          openOnboardingModal();
          return;
        }
      } catch (e) {
        console.error('Failed to check admins:', e);
      }

      // 2. Check auth
      if (!state.token) {
        openLoginModal();
        return;
      }

      // 3. Load App
      await loadCollections();
      initRealtime();
      selectNav('home');
    }

    // API Helper
    async function api(path, options = {}) {
      const headers = {
        ...(options.headers || {}),
      };

      // Only set Content-Type: application/json if body is a string (e.g. JSON.stringify)
      // Do NOT set it for GET, DELETE (prevents Fastify empty body error), or FormData
      if (options.body && typeof options.body === 'string') {
        headers['Content-Type'] = 'application/json';
      }

      if (state.token) {
        headers['Authorization'] = `Bearer ${state.token}`;
      }

      const res = await fetch(path, { ...options, headers });
      if (res.status === 401) {
        logout();
        throw new Error('Session expired');
      }
      if (!res.ok) {
        const errData = await res.json().catch(() => ({}));
        throw new Error(errData.message || `Request failed with status ${res.status}`);
      }
      if (res.status === 204) return null;
      return res.json();
    }

    // Realtime SSE
    function initRealtime() {
      if (state.realtimeEventSource) {
        state.realtimeEventSource.close();
      }

      const url = state.token ? `/api/realtime?token=${state.token}` : '/api/realtime';
      const es = new EventSource(url);
      state.realtimeEventSource = es;

      const handleConnect = async (e) => {
        const data = JSON.parse(e.data);
        // Subscribe to all topics
        await fetch('/api/realtime', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            clientId: data.clientId,
            subscriptions: ['*'],
          }),
        }).catch(() => {});
      };

      es.addEventListener('NS_CONNECT', handleConnect);
      es.addEventListener('NB_CONNECT', handleConnect);

      // Listen for updates on any collection
      for (const col of state.collections) {
        es.addEventListener(col.name, (e) => {
          const payload = JSON.parse(e.data);
          toast(`[Realtime] Record ${payload.action}d in ${col.name}`, 'success');
          if (state.activeCollection && state.activeCollection.name === col.name && state.collectionTab === 'records') {
            loadRecords();
          }
        });
      }
    }

        state.collections = res.items || [];
        renderCollectionsList();

      }
    }

    async function loadRecords() {
      if (!state.activeCollection) return;
      try {
        const queryParams = new URLSearchParams({
          page: state.recordsPage.toString(),
          perPage: state.recordsPerPage.toString(),
        });
        if (state.recordsFilter) {

        }

        state.records = res.items || [];
        state.recordsTotal = res.totalItems || 0;

        renderRecordsTable();
      } catch (e) {
        toast(e.message, 'error');
      }
    }

    function renderRecordsTable() {
      const col = state.activeCollection;
      const thContainer = document.getElementById('table-head');
      const tbContainer = document.getElementById('table-body');
      const paginationLabel = document.getElementById('pagination-label');

      if (!thContainer || !tbContainer) return;

      paginationLabel.textContent = `Showing ${state.records.length} of ${state.recordsTotal} records`;

      // Columns
      const fields = col.schema.map(f => f.name);
      thContainer.innerHTML = `
        <th>ID</th>
        ${fields.map(f => `<th>${f}</th>`).join('')}
        <th>Created</th>
        <th>Actions</th>
      `;

      if (state.records.length === 0) {
        tbContainer.innerHTML = `<tr><td colspan="${fields.length + 3}" style="text-align:center;padding:3rem;color:var(--text-muted);">No records found in this collection.</td></tr>`;
        return;
      }

      tbContainer.innerHTML = state.records.map(rec => `
        <tr>
          <td><span class="id-pill">${rec.id}</span></td>
          ${fields.map(f => {
            const schemaField = col.schema.find(sf => sf.name === f);
            const val = rec[f];
            if (val === null || val === undefined || val === '') return '<td style="color:#6b7280;">NULL</td>';
            if (schemaField && schemaField.type === 'file') {
              const filename = String(val);
              const fileUrl = `/api/files/${col.name}/${rec.id}/${filename}?token=${state.token}`;
              const isImg = /\.(jpe?g|png|gif|webp|svg)$/i.test(filename);
              if (isImg) {
                return `<td><a href="${fileUrl}" target="_blank" style="display:inline-flex; align-items:center; gap:6px; color:#60a5fa; text-decoration:none;"><img src="${fileUrl}" style="width:24px; height:24px; object-fit:cover; border-radius:4px; border:1px solid var(--border-subtle);"/> <span style="font-family:var(--font-mono); font-size:12px;">${filename}</span></a></td>`;
              }
              return `<td><a href="${fileUrl}" target="_blank" style="color:#60a5fa; text-decoration:underline; font-family:var(--font-mono); font-size:12px;">📎 ${filename}</a></td>`;
            }
            if (typeof val === 'boolean') return `<td><span class="badge ${val ? 'badge-get' : 'badge-delete'}">${val}</span></td>`;
            if (typeof val === 'object') return `<td><code>${JSON.stringify(val).slice(0, 30)}...</code></td>`;
            return `<td>${String(val)}</td>`;
          }).join('')}
          <td style="color:var(--text-muted);font-size:12px;">${new Date(rec.created).toLocaleString()}</td>
          <td>
            <button class="btn btn-secondary btn-sm" onclick="editRecord('${rec.id}')">Edit</button>
            <button class="btn btn-danger btn-sm" onclick="deleteRecord('${rec.id}')">Delete</button>
          </td>
        </tr>
      `).join('');
    }

    function handleSearch(val) {
      if (!val.trim()) {

        const firstTextField = state.activeCollection?.schema.find(f => f.type === 'text');
        if (firstTextField) {
          state.recordsFilter = `${firstTextField.name} ~ '${val.trim()}'`;

      loadRecords();
    }

    async function submitNewRecord() {
      const col = state.activeCollection;
      const hasFileInput = col.schema.some(f => f.type === 'file');

      let body;
      if (hasFileInput) {
        const formData = new FormData();
        if (col.type === 'auth') {
          formData.append('email', document.getElementById('field-email').value);
          formData.append('password', document.getElementById('field-password').value);
        }

        for (const f of col.schema) {
          const el = document.getElementById(`field-${f.name}`);
          if (!el) continue;
          if (f.type === 'file') {
            if (el.files && el.files[0]) {
              formData.append(f.name, el.files[0]);
            }
          } else if (f.type === 'bool') {
            formData.append(f.name, el.value === 'true' ? 'true' : 'false');
          } else if (f.type === 'number') {
            if (el.value !== '') formData.append(f.name, el.value);
          } else {
            formData.append(f.name, el.value);
          }
        }
        body = formData;
      } else {
        const data = {};
        if (col.type === 'auth') {
          data.email = document.getElementById('field-email').value;
          data.password = document.getElementById('field-password').value;
        }

        for (const f of col.schema) {
          const el = document.getElementById(`field-${f.name}`);
          if (!el) continue;
          if (f.type === 'bool') {
            data[f.name] = el.value === 'true';
          } else if (f.type === 'number') {
            data[f.name] = el.value !== '' ? Number(el.value) : null;
          } else {
            data[f.name] = el.value;
          }
        }
        body = JSON.stringify(data);
      }

      try {
        await api(`/api/collections/${col.name}/records`, {
          method: 'POST',
          body,
        });
        toast('Record created successfully!', 'success');
        closeModal();
        loadRecords();
      } catch (e) {
        toast(e.message, 'error');
      }
    }

    async function submitEditRecord(id) {
      const col = state.activeCollection;
      let hasNewFile = false;
      for (const f of col.schema) {
        if (f.type === 'file') {
          const el = document.getElementById(`field-edit-${f.name}`);
          if (el && el.files && el.files[0]) {
            hasNewFile = true;
            break;
          }
        }
      }

      let body;
      if (hasNewFile) {
        const formData = new FormData();
        for (const f of col.schema) {
          const el = document.getElementById(`field-edit-${f.name}`);
          if (!el) continue;
          if (f.type === 'file') {
            if (el.files && el.files[0]) {
              formData.append(f.name, el.files[0]);
            }
          } else if (f.type === 'bool') {
            formData.append(f.name, el.value === 'true' ? 'true' : 'false');
          } else if (f.type === 'number') {
            if (el.value !== '') formData.append(f.name, el.value);
          } else {
            formData.append(f.name, el.value);
          }
        }
        body = formData;
      } else {
        const data = {};
        for (const f of col.schema) {
          const el = document.getElementById(`field-edit-${f.name}`);
          if (!el) continue;
          if (f.type === 'file') {
            // Keep existing file
            continue;
          }
          if (f.type === 'bool') {
            data[f.name] = el.value === 'true';
          } else if (f.type === 'number') {

            data[f.name] = el.value;
          }

        body = JSON.stringify(data);
      }

    async function exportData(format) {
      const menu = document.getElementById('export-dropdown-menu');
      if (menu) menu.style.display = 'none';

      const col = state.activeCollection;
      if (!col) return;

      try {
        toast(`Exporting ${col.name} as ${format.toUpperCase()}...`, 'info');
        let url = `/api/collections/${col.name}/export?format=${format}`;
        if (state.recordsFilter) {
          url += `&filter=${encodeURIComponent(state.recordsFilter)}`;
        }

        const res = await fetch(url, {
          headers: {
            Authorization: `Bearer ${state.token}`
          }
        });

        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.message || 'Export failed');
        }

        const blob = await res.blob();
        const blobUrl = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = blobUrl;

        const disposition = res.headers.get('content-disposition');
        let filename = `${col.name}_${new Date().toISOString().slice(0, 10)}.${format}`;
        if (disposition && disposition.includes('filename="')) {
          filename = disposition.split('filename="')[1].split('"')[0];
        } else if (disposition && disposition.includes('filename=')) {
          filename = disposition.split('filename=')[1].trim();
        }

        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        window.URL.revokeObjectURL(blobUrl);

        toast(`Exported ${filename} successfully!`, 'success');
      } catch (e) {
        toast(e.message, 'error');
      }
    }

    // CSV Import State & Logic
    let currentImport = {
      fileName: '',
      headers: [],
      rows: [],
      mapping: {},
      continueOnError: true,
    };

    function parseCsvClient(csvText) {
      const text = csvText.replace(/^\uFEFF/, '').trim();
      if (!text) return { headers: [], rows: [] };

      // Detect delimiter from first line
      const firstLine = text.split(/\r?\n/)[0] || '';
      let inQ = false, commas = 0, semis = 0, tabs = 0;
      for (let i = 0; i < firstLine.length; i++) {
        const c = firstLine[i];
        if (c === '"') inQ = !inQ;
        else if (!inQ) {
          if (c === ',') commas++;
          else if (c === ';') semis++;
          else if (c === '\t') tabs++;
        }
      }
      const delimiter = (tabs > commas && tabs > semis) ? '\t' : (semis > commas && semis > tabs) ? ';' : ',';

      const rows = [];
      let currentRow = [];
      let currentCell = '';
      let inQuotes = false;
      let i = 0;
      const len = text.length;

      while (i < len) {
        const char = text[i];
        if (inQuotes) {
          if (char === '"') {
            if (i + 1 < len && text[i + 1] === '"') {
              currentCell += '"';
              i += 2;
              continue;
            } else {
              inQuotes = false;
              i++;
              continue;
            }
          } else {
            currentCell += char;
            i++;
            continue;
          }
        } else {
          if (char === '"') {
            inQuotes = true;
            i++;
            continue;
          } else if (char === delimiter) {
            currentRow.push(currentCell);
            currentCell = '';
            i++;
            continue;
          } else if (char === '\r') {
            if (i + 1 < len && text[i + 1] === '\n') {
              i++;
            }
            currentRow.push(currentCell);
            currentCell = '';
            rows.push(currentRow);
            currentRow = [];
            i++;
            continue;
          } else if (char === '\n') {
            currentRow.push(currentCell);
            currentCell = '';
            rows.push(currentRow);
            currentRow = [];
            i++;
            continue;
          } else {
            currentCell += char;
            i++;
            continue;
          }
        }
      }
      currentRow.push(currentCell);
      rows.push(currentRow);

      if (rows.length > 0 && rows[rows.length - 1].length === 1 && rows[rows.length - 1][0] === '') {
        rows.pop();
      }

      if (rows.length === 0) return { headers: [], rows: [] };
      const headers = rows[0].map(h => h.trim());
      const dataRows = [];
      for (let r = 1; r < rows.length; r++) {
        const vals = rows[r];
        if (vals.length === 1 && vals[0].trim() === '') continue;
        const rowObj = {};
        for (let c = 0; c < headers.length; c++) {
          rowObj[headers[c]] = vals[c] !== undefined ? vals[c] : '';
        }
        dataRows.push(rowObj);
      }

      return { headers, rows: dataRows };
    }

    function findBestFieldMatch(headerName, col) {
      const clean = headerName.toLowerCase().replace(/[\s\-_]/g, '');
      if (!clean) return '';

      if (col.type === 'auth') {
        if (clean === 'email' || clean === 'mail') return 'email';
        if (clean === 'password' || clean === 'pass') return 'password';
      }

      // Exact or normalized match
      for (const f of col.schema) {
        const fClean = f.name.toLowerCase().replace(/[\s\-_]/g, '');
        if (fClean === clean) return f.name;
      }

      // Common aliases
      if (clean === 'id') return 'id';
      if (clean === 'created' || clean === 'createdat') return 'created';
      if (clean === 'updated' || clean === 'updatedat') return 'updated';

      // Substring match
      for (const f of col.schema) {
        const fClean = f.name.toLowerCase().replace(/[\s\-_]/g, '');
        if (clean.includes(fClean) || fClean.includes(clean)) {
          return f.name;
        }
      }

      return '';
    }

        } else if (f.type === 'select' && f.options?.values?.length) {
          sampleRow1.push(f.options.values[0]);
          sampleRow2.push(f.options.values[1] || f.options.values[0]);
        } else if (f.type === 'json') {
          sampleRow1.push('{"tag": "demo"}');
          sampleRow2.push('{"tag": "test"}');
        } else {
          sampleRow1.push(`Sample ${f.name} 1`);
          sampleRow2.push(`Sample ${f.name} 2`);
        }
      }

      const csv = [
        headers.join(','),
        sampleRow1.map(v => v.includes(',') || v.includes('"') ? `"${v.replace(/"/g, '""')}"` : v).join(','),
        sampleRow2.map(v => v.includes(',') || v.includes('"') ? `"${v.replace(/"/g, '""')}"` : v).join(',')
      ].join('\r\n');

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${col.name}_sample_template.csv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function openImportModal() {
      const col = state.activeCollection;
      if (!col) return;

      currentImport = {
        fileName: '',
        headers: [],
        rows: [],
        mapping: {},
        continueOnError: true,
      };

      renderImportModalStep1();
    }

    function renderImportModalStep1() {
      const col = state.activeCollection;
      const modal = document.getElementById('modal-root');
      modal.innerHTML = `
        <div class="modal-backdrop" onclick="if(event.target===this)closeModal()">
          <div class="modal modal-lg">
            <div class="modal-header">
              <div>
                <h2 class="modal-title">Import CSV — ${col.name}</h2>
                <div style="font-size:12px; color:var(--text-muted); margin-top:2px;">Step 1: Upload or drag & drop CSV file</div>
              </div>
              <button class="btn btn-secondary btn-sm" onclick="closeModal()">✕</button>
            </div>
            <div class="modal-body" style="gap:1.25rem;">
              <div class="dropzone" id="csv-dropzone" 
                   ondragover="handleDragOver(event)" 
                   ondragleave="handleDragLeave(event)" 
                   ondrop="handleFileDrop(event)"
                   onclick="document.getElementById('csv-file-picker').click()">
                <div style="width:48px; height:48px; border-radius:50%; background:rgba(59,130,246,0.1); color:#60a5fa; display:flex; align-items:center; justify-content:center; font-size:24px;">
                  📁
                </div>
                <div style="font-weight:600; font-size:14px;">Drag & drop your CSV file here, or click to browse</div>
                <div style="font-size:12px; color:var(--text-muted);">Supports .csv files, RFC 4180 format, and auto-detects delimiters (, ; \\t)</div>
                <input type="file" id="csv-file-picker" accept=".csv,text/csv" style="display:none;" onchange="handleFileSelect(event)">
              </div>

              <div style="display:flex; justify-content:space-between; align-items:center; padding:0.75rem 1rem; background:var(--bg-input); border-radius:6px; border:1px solid var(--border-subtle); font-size:12px;">
                <span style="color:var(--text-muted);">Need a sample CSV with all collection headers?</span>
                <button class="btn btn-secondary btn-sm" onclick="downloadSampleCsv()">📥 Download Sample CSV</button>
              </div>

              <div>
                <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:0.5rem;">
                  <label class="form-label" style="margin:0; cursor:pointer;" onclick="togglePasteArea()">
                    <span id="paste-toggle-icon">▶</span> Or paste raw CSV text
                  </label>
                </div>
                <div id="paste-csv-container" style="display:none;">
                  <textarea class="form-textarea" id="paste-csv-input" placeholder="id,title,views&#10;1,My First Post,100" style="min-height:90px;"></textarea>
                  <div style="display:flex; justify-content:flex-end; margin-top:0.5rem;">
                    <button class="btn btn-secondary btn-sm" onclick="processPastedCsv()">Parse Pasted CSV</button>
                  </div>
                </div>
              </div>
            </div>
            <div class="modal-footer">
              <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
            </div>
          </div>
        </div>
      `;
    }

    function togglePasteArea() {
      const c = document.getElementById('paste-csv-container');
      const icon = document.getElementById('paste-toggle-icon');
      if (c.style.display === 'none') {
        c.style.display = 'block';
        icon.textContent = '▼';
      } else {
        c.style.display = 'none';
        icon.textContent = '▶';
      }
    }

    function handleDragOver(e) {
      e.preventDefault();
      const dz = document.getElementById('csv-dropzone');
      if (dz) dz.classList.add('dragover');
    }

    function handleDragLeave(e) {
      e.preventDefault();
      const dz = document.getElementById('csv-dropzone');
      if (dz) dz.classList.remove('dragover');
    }

    function handleFileDrop(e) {
      e.preventDefault();
      const dz = document.getElementById('csv-dropzone');
      if (dz) dz.classList.remove('dragover');

      if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]) {
        readAndProcessFile(e.dataTransfer.files[0]);
      }
    }

    function handleFileSelect(e) {
      if (e.target && e.target.files && e.target.files[0]) {
        readAndProcessFile(e.target.files[0]);
      }
    }

    function processPastedCsv() {
      const val = document.getElementById('paste-csv-input').value;
      if (!val.trim()) {
        toast('Please paste some CSV text first', 'error');
        return;
      }
      readAndProcessText(val, 'pasted_data.csv');
    }

    function readAndProcessFile(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        const text = e.target.result;
        readAndProcessText(text, file.name);
      };
      reader.onerror = () => {
        toast('Failed to read file', 'error');
      };
      reader.readAsText(file);
    }

    function readAndProcessText(text, fileName) {
      const parsed = parseCsvClient(text);
      if (parsed.headers.length === 0 || parsed.rows.length === 0) {
        toast('CSV file is empty or could not be parsed', 'error');
        return;
      }

      const col = state.activeCollection;
      currentImport.fileName = fileName;
      currentImport.headers = parsed.headers;
      currentImport.rows = parsed.rows;
      currentImport.mapping = {};

      // Auto-map columns
      for (const h of parsed.headers) {
        currentImport.mapping[h] = findBestFieldMatch(h, col);
      }

      renderImportModalStep2();
    }

    function renderImportModalStep2() {
      const col = state.activeCollection;
      const modal = document.getElementById('modal-root');

      // Options for schema field dropdown
      const fieldOptions = [
        { value: '', label: '-- Skip Field (Do not import) --' }
      ];

      if (col.type === 'auth') {
        fieldOptions.push(
          { value: 'email', label: 'email (email) *' },
          { value: 'password', label: 'password (text)' }
        );
      }

      for (const f of col.schema) {
        fieldOptions.push({
          value: f.name,
          label: `${f.name} (${f.type})${f.required ? ' *' : ''}`
        });
      }

      fieldOptions.push(
        { value: 'id', label: 'id (system ID)' },
        { value: 'created', label: 'created (system timestamp)' },
        { value: 'updated', label: 'updated (system timestamp)' }
      );

      modal.innerHTML = `
        <div class="modal-backdrop" onclick="if(event.target===this)closeModal()">
          <div class="modal modal-lg">
            <div class="modal-header">
              <div>
                <h2 class="modal-title">Visual Column Mapping — ${col.name}</h2>
                <div style="font-size:12px; color:var(--text-muted); margin-top:2px;">
                  Step 2: Map CSV columns to collection fields (File: <span class="code-badge">${currentImport.fileName}</span> — <strong>${currentImport.rows.length}</strong> rows detected)
                </div>
              </div>
              <button class="btn btn-secondary btn-sm" onclick="closeModal()">✕</button>
            </div>
            <div class="modal-body" style="gap:1.25rem;">
              <div class="mapping-table-container">
                <table class="mapping-table">
                  <thead>
                    <tr>
                      <th style="width:28%;">CSV Column Header</th>
                      <th style="width:32%;">Sample Values</th>
                      <th style="width:5%; text-align:center;"></th>
                      <th style="width:35%;">Collection Destination Field</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${currentImport.headers.map((h, idx) => {
                      const sampleVals = currentImport.rows.slice(0, 2).map(r => r[h]).filter(v => v !== undefined && v !== '');
                      const sampleStr = sampleVals.length > 0 ? sampleVals.join(' | ') : '<em style="color:#6b7280;">(empty)</em>';
                      const selected = currentImport.mapping[h] || '';

                      return `
                        <tr>
                          <td>
                            <span style="font-weight:600; font-size:13px;">${h}</span>
                          </td>
                          <td>
                            <span class="code-badge" title="${String(sampleStr).replace(/"/g, '&quot;')}">${sampleStr}</span>
                          </td>
                          <td style="text-align:center; color:var(--text-muted); font-size:14px;">
                            ➔
                          </td>
                          <td>
                            <select class="form-select" style="padding:0.4rem 0.6rem; font-size:12px; width:100%;" onchange="updateColumnMapping('${h.replace(/'/g, "\\'")}', this.value)">
                              ${fieldOptions.map(opt => `
                                <option value="${opt.value}" ${opt.value === selected ? 'selected' : ''}>${opt.label}</option>
                              `).join('')}
                            </select>
                          </td>
                        </tr>
                      `;
                    }).join('')}
                  </tbody>
                </table>
              </div>

              <!-- Live Mapped Preview -->
              <div>
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.5rem;">
                  <h4 style="font-size:13px; font-weight:700;">Live Mapped Preview (First 3 Rows)</h4>
                  <span style="font-size:11px; color:var(--text-muted);">Updates in real time as mappings change</span>
                </div>
                <div class="mapping-table-container" style="max-height:160px; overflow:auto;">
                  <table class="mapping-table" id="live-preview-table">
                    <!-- Injected dynamically -->
                  </table>
                </div>
              </div>

              <!-- Import Options -->
              <div style="display:flex; align-items:center; justify-content:space-between; padding:0.75rem 1rem; background:var(--bg-input); border-radius:6px; border:1px solid var(--border-subtle); font-size:12px;">
                <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
                  <input type="checkbox" id="import-continue-on-error" ${currentImport.continueOnError ? 'checked' : ''} onchange="currentImport.continueOnError = this.checked">
                  <span>Skip records with validation errors and continue importing</span>
                </label>
                <span style="color:var(--text-muted);">Ready to import: <strong>${currentImport.rows.length}</strong> records</span>
              </div>
            </div>
            <div class="modal-footer">
              <button class="btn btn-secondary" onclick="renderImportModalStep1()">← Change File</button>
              <button class="btn btn-primary" id="btn-do-import" onclick="executeImport()">
                <span>Import ${currentImport.rows.length} Records</span>
              </button>
            </div>
          </div>
        </div>
      `;

      renderLivePreview();
    }

    function updateColumnMapping(csvHeader, targetField) {
      currentImport.mapping[csvHeader] = targetField;
      renderLivePreview();
    }

    function renderLivePreview() {
      const table = document.getElementById('live-preview-table');
      if (!table) return;

      const activeMappings = Object.entries(currentImport.mapping).filter(([_, target]) => Boolean(target));
      if (activeMappings.length === 0) {
        table.innerHTML = `<tbody><tr><td colspan="5" style="text-align:center; padding:1.5rem; color:var(--text-muted);">No fields mapped yet. Map at least one column above to preview data.</td></tr></tbody>`;
        return;
      }

      const mappedHeaders = activeMappings.map(([_, target]) => target);
      const previewRows = currentImport.rows.slice(0, 3);

      table.innerHTML = `
        <thead>
          <tr>
            ${mappedHeaders.map(h => `<th>${h}</th>`).join('')}
          </tr>
        </thead>
        <tbody>
          ${previewRows.map(row => `
            <tr>
              ${activeMappings.map(([csvH, _]) => {
                const val = row[csvH];
                if (val === undefined || val === '') return '<td style="color:#6b7280;">NULL</td>';
                return `<td>${String(val).slice(0, 40)}</td>`;
              }).join('')}
            </tr>
          `).join('')}
        </tbody>
      `;
    }

    async function executeImport() {
      const col = state.activeCollection;
      if (!col) return;

      const activeMappings = Object.entries(currentImport.mapping).filter(([_, target]) => Boolean(target));
      if (activeMappings.length === 0) {
        toast('Please map at least one CSV column to a collection field', 'error');
        return;
      }

      const btn = document.getElementById('btn-do-import');
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = '<span>Importing...</span>';
      }

      try {
        // Transform all rows using mapped columns
        const recordsToImport = [];
        for (const row of currentImport.rows) {
          const rec = {};
          let hasAnyVal = false;
          for (const [csvH, targetF] of activeMappings) {
            const rawVal = row[csvH];
            if (rawVal !== undefined && rawVal !== '') {
              hasAnyVal = true;
              rec[targetF] = rawVal;
            }
          }
          if (hasAnyVal) {
            recordsToImport.push(rec);
          }
        }

        if (recordsToImport.length === 0) {
          throw new Error('No non-empty records found to import with current mappings');
        }

        const res = await api(`/api/collections/${col.name}/import`, {
          method: 'POST',
          body: JSON.stringify({
            records: recordsToImport,
            options: {
              continueOnError: currentImport.continueOnError,
            },
          }),
        });

        renderImportResults(res);
        await loadRecords();
      } catch (e) {
        toast(e.message, 'error');
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = `<span>Import ${currentImport.rows.length} Records</span>`;
        }
      }
    }

    function renderImportResults(res) {
      const col = state.activeCollection;
      const modal = document.getElementById('modal-root');

      const hasErrors = res.errors && res.errors.length > 0;

      modal.innerHTML = `
        <div class="modal-backdrop" onclick="if(event.target===this)closeModal()">
          <div class="modal modal-lg">
            <div class="modal-header">
              <h2 class="modal-title">Import Finished — ${col.name}</h2>
              <button class="btn btn-secondary btn-sm" onclick="closeModal()">✕</button>
            </div>
            <div class="modal-body" style="gap:1.25rem;">
              <div style="background:${hasErrors && res.imported === 0 ? 'rgba(239,68,68,0.1)' : 'rgba(16,185,129,0.1)'}; border:1px solid ${hasErrors && res.imported === 0 ? 'rgba(239,68,68,0.3)' : 'rgba(16,185,129,0.3)'}; border-radius:8px; padding:1.25rem; display:flex; align-items:center; gap:1rem;">
                <div style="font-size:28px;">
                  ${res.imported > 0 ? '🎉' : '⚠️'}
                </div>
                <div>
                  <div style="font-weight:700; font-size:15px; color:${res.imported > 0 ? '#34d399' : '#f87171'};">
                    ${res.imported} of ${res.total} records imported successfully
                  </div>
                  <div style="font-size:12px; color:var(--text-muted); margin-top:2px;">
                    ${hasErrors ? `${res.failed} records had issues and were skipped.` : 'All records were validated and inserted into the database.'}
                  </div>
                </div>
              </div>

              ${hasErrors ? `
                <div>
                  <h4 style="font-size:13px; font-weight:700; color:#f87171; margin-bottom:0.5rem;">Errors & Skipped Rows (${res.errors.length})</h4>
                  <div class="mapping-table-container" style="max-height:220px; overflow-y:auto;">
                    <table class="mapping-table">
                      <thead>
                        <tr>
                          <th style="width:15%;">Row</th>
                          <th style="width:85%;">Error Message</th>
                        </tr>
                      </thead>
                      <tbody>
                        ${res.errors.map(err => `
                          <tr>
                            <td><span class="code-badge">Row ${err.row}</span></td>
                            <td style="color:#f87171; font-family:var(--font-mono); font-size:12px;">${err.error}</td>
                          </tr>
                        `).join('')}
                      </tbody>
                    </table>
                  </div>
                </div>
              ` : ''}
            </div>
            <div class="modal-footer">
              <button class="btn btn-primary" onclick="closeModal()">Done</button>
            </div>
          </div>
        </div>
      `;

      toast(`Import finished: ${res.imported} records added to ${col.name}`, res.imported > 0 ? 'success' : 'error');
    }

    function openLoginModal() {
      const modal = document.getElementById('modal-root');
      modal.innerHTML = `
        <div class="modal-backdrop">
          <div class="modal" style="max-width:400px;">
            <div style="display:flex; justify-content:center; margin-top:0.5rem; margin-bottom:0.75rem;">
              <div style="width:50px; height:50px; border-radius:12px; background:#0c0e14; border:1px solid rgba(59,130,246,0.4); display:flex; align-items:center; justify-content:center; box-shadow:0 6px 16px -2px rgba(59,130,246,0.35);">
                <img src="/_/icon.svg" width="34" height="34" alt="NodeStack" style="display:block;" />
              </div>
            </div>
            <div class="modal-header" style="justify-content:center; text-align:center;">
              <h2 class="modal-title">NodeStack Admin Login</h2>
            </div>
            <div class="modal-body">
              <div class="form-group">
                <label class="form-label">Admin Email</label>
                <input type="email" class="form-input" id="login-email" required autofocus>
              </div>
              <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" class="form-input" id="login-password" required>
              </div>
            </div>
            <div class="modal-footer">
              <button class="btn btn-primary" style="width:100%;" onclick="submitLogin()">Sign In</button>
            </div>
          </div>
        </div>
      `;
    }

    async function submitLogin() {
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      try {
        const res = await api('/api/admins/auth-with-password', {
          method: 'POST',
          body: JSON.stringify({ email, password }),
        });

        state.token = res.token;
        state.admin = res.admin;
        localStorage.setItem('nodestack_token', res.token);
        localStorage.setItem('nodestack_admin', JSON.stringify(res.admin));

        closeModal();
        await loadCollections();
        initRealtime();
        selectNav('home');
        toast('Logged in successfully', 'success');
      } catch (e) {
        toast(e.message, 'error');
      }
    }

    function openOnboardingModal() {
      const modal = document.getElementById('modal-root');
      modal.innerHTML = `
        <div class="modal-backdrop">
          <div class="modal" style="max-width:440px;">
            <div style="display:flex; align-items:center; gap:0.85rem; margin-bottom:0.75rem;">
              <div style="width:46px; height:46px; border-radius:12px; background:#0c0e14; border:1px solid rgba(59,130,246,0.4); display:flex; align-items:center; justify-content:center; box-shadow:0 6px 16px -2px rgba(59,130,246,0.35); flex-shrink:0;">
                <img src="/_/icon.svg" width="30" height="30" alt="NodeStack" style="display:block;" />
              </div>

                <h2 class="modal-title">Welcome to NodeStack 👋</h2>
                <span style="color:var(--text-muted); font-size:12px;">Create your first Superuser</span>

            </div>

              <p style="color:var(--text-muted); font-size:13px; line-height:1.4;">

              </p>
              <div class="form-group">
                <label class="form-label">Admin Email *</label>
                <input type="email" class="form-input" id="onboard-email" placeholder="admin@example.com" required>
              </div>

    async function submitOnboarding() {
      const email = document.getElementById('onboard-email').value;
      const password = document.getElementById('onboard-password').value;

      try {
        const res = await api('/api/admins/create-initial', {

    function logout() {
      state.token = '';
      state.admin = null;
      localStorage.removeItem('nodestack_token');
      localStorage.removeItem('nodestack_admin');
      localStorage.removeItem('nb_token');
      localStorage.removeItem('nb_admin');
      if (state.realtimeEventSource) {
        state.realtimeEventSource.close();
      }
      openLoginModal();
    }

    // Toast helper
    function toast(msg, type = 'success') {
      const container = document.getElementById('toast-container');
      const el = document.createElement('div');
      el.className = `toast ${type}`;
      el.innerHTML = `<span>${type === 'success' ? '✓' : '⚠'}</span> <span>${msg}</span>`;
      container.appendChild(el);
      setTimeout(() => el.remove(), 4000);
    }

    // Copy helper
    function copyToClipboard(text, btnEl) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
          toast('URL copied to clipboard!', 'success');
          if (btnEl) {
            const orig = btnEl.innerHTML;
            btnEl.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>';
            setTimeout(() => { btnEl.innerHTML = orig; }, 1500);
          }
        }).catch(() => fallbackCopy(text, btnEl));
      } else {
        fallbackCopy(text, btnEl);
      }
    }

    function fallbackCopy(text, btnEl) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      toast('URL copied to clipboard!', 'success');
      if (btnEl) {
        const orig = btnEl.innerHTML;
        btnEl.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>';
        setTimeout(() => { btnEl.innerHTML = orig; }, 1500);
      }
    }

    // Run on startup
    window.addEventListener('DOMContentLoaded', init);
  </script>
