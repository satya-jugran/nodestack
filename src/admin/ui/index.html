<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NodeStack — Admin Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="/_/icon.svg">
  <link rel="alternate icon" href="/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/codemirror.css">
  <link rel="stylesheet" href="./css/main.css">
  <link rel="stylesheet" href="./css/rules.css">
  <link rel="stylesheet" href="./css/analytics.css">
  <link rel="stylesheet" href="./css/webhooks.css">
  <script>
    (function() {
      try {
        var stored = localStorage.getItem('nodestack_theme') || 'system';
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var resolved = stored === 'system' ? (prefersDark ? 'dark' : 'light') : stored;
        document.documentElement.classList.remove('dark', 'light');
        document.documentElement.classList.add(resolved);
        document.documentElement.setAttribute('data-theme', stored);
        document.documentElement.setAttribute('data-color-scheme', resolved);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo" onclick="selectNav('home')" style="cursor: pointer;" title="Go to Dashboard Overview">
          <div class="brand-icon" style="background: transparent; padding: 0;">
            <img src="/_/icon.svg" width="28" height="28" alt="NodeStack" style="display: block; border-radius: 6px;" />
          </div>
          <span>NodeStack</span>
        </div>
        <span class="version-tag">v2.2.0</span>
      </div>

      <div style="padding: 0.75rem 1rem 0.25rem; display: flex; flex-direction: column; gap: 4px;">
        <div class="sidebar-nav-item active" id="nav-home" onclick="selectNav('home')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
          <span>Overview</span>
        </div>
        <div class="sidebar-nav-item" id="nav-analytics" onclick="selectNav('analytics')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
          <span>Analytics</span>
        </div>
        <div class="sidebar-nav-item" id="nav-collections" onclick="selectNav('collections')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
          <span>Collections</span>
          <span class="badge badge-get" id="sidebar-collections-count" style="margin-left: auto; font-size: 10px; padding: 1px 6px;">0</span>
        </div>
        <div class="sidebar-nav-item" id="nav-webhooks" onclick="selectNav('webhooks')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 16.98h-5.99c-1.1 0-1.95.94-2.48 1.9A4 4 0 0 1 2 17c0-2.21 1.79-4 4-4h5.99c1.1 0 1.95-.94 2.48-1.9A4 4 0 0 1 22 13c0 2.21-1.79 4-4 4z"/><circle cx="6" cy="17" r="1"/><circle cx="18" cy="13" r="1"/></svg>
          <span>Webhooks</span>
          <span class="badge badge-primary" id="sidebar-webhooks-count" style="margin-left: auto; font-size: 10px; padding: 1px 6px; display: none;">0</span>
        </div>
        <div class="sidebar-nav-item" id="nav-functions" onclick="selectNav('functions')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
          <span>Functions</span>
          <span class="badge badge-primary" id="sidebar-functions-count" style="margin-left: auto; font-size: 10px; padding: 1px 6px; display: none;">0</span>
        </div>
        <div class="sidebar-nav-item" id="nav-flows" onclick="selectNav('flows')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="3"></circle><line x1="12" y1="8" x2="12" y2="12"></line><circle cx="6" cy="19" r="3"></circle><circle cx="18" cy="19" r="3"></circle><path d="M12 12h-6v4"></path><path d="M12 12h6v4"></path></svg>
          <span>Flows</span>
          <span class="badge badge-primary" id="sidebar-flows-count" style="margin-left: auto; font-size: 10px; padding: 1px 6px; display: none;">0</span>
        </div>
        <div class="sidebar-nav-item" id="nav-plugins" onclick="selectNav('plugins')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          <span>Plugins</span>
          <span class="badge badge-primary" id="sidebar-plugins-badge" style="margin-left: auto; font-size: 10px; padding: 1px 6px; display: none;">0</span>
        </div>
        <div class="sidebar-nav-item" id="nav-snapshots" onclick="selectNav('snapshots')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
          <span>Snapshots</span>
          <span id="sidebar-snapshot-dot" style="margin-left: auto; width: 7px; height: 7px; border-radius: 50%; background: #10b981; display: none;"></span>
        </div>
        <div class="sidebar-nav-item" id="nav-logs" onclick="selectNav('logs')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
          <span>Audit Logs</span>
        </div>
      </div>

      <div class="sidebar-bottom" style="margin-top: auto;">
        <!-- Theme Selector (Light, Dark, System) -->
        <div class="sidebar-theme-container">
          <div class="sidebar-theme-selector" id="sidebar-theme-selector" role="radiogroup" aria-label="Appearance Theme">
            <button type="button" class="theme-picker-btn" id="theme-btn-light" data-theme-value="light" onclick="setTheme('light')" title="Light Theme" aria-label="Light Theme">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
              <span>Light</span>
            </button>
            <button type="button" class="theme-picker-btn" id="theme-btn-dark" data-theme-value="dark" onclick="setTheme('dark')" title="Dark Theme" aria-label="Dark Theme">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
              <span>Dark</span>
            </button>
            <button type="button" class="theme-picker-btn" id="theme-btn-system" data-theme-value="system" onclick="setTheme('system')" title="System Theme" aria-label="System Theme">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
              <span>Auto</span>
            </button>
          </div>
        </div>

        <a href="/documentation/" target="_blank" class="sidebar-nav-item" id="nav-documentation" style="text-decoration: none; color: inherit;" title="NodeStack Documentation & Guides">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>
          <span>Documentation</span>
          <span style="margin-left: auto; font-size: 11px; opacity: 0.6; color: var(--accent-primary);">↗</span>
        </a>
        <a href="/_/docs" target="_blank" class="sidebar-nav-item" id="nav-docs" onclick="openDocsWithApp(event)" style="text-decoration: none; color: inherit;" title="Interactive OpenAPI 3.0 Reference">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
          <span>API Docs (OpenAPI)</span>
          <span style="margin-left: auto; font-size: 11px; opacity: 0.6; color: var(--accent-primary);">↗</span>
        </a>
        <div class="sidebar-nav-item" onclick="logout()" style="margin-top: 0.5rem; border-top: 1px solid var(--border-subtle); padding-top: 0.75rem;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
          <span id="admin-user-email">Logout</span>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Top Bar -->
      <div class="top-bar">
        <div class="page-title-box">
          <nav class="breadcrumb-nav" id="breadcrumb-nav" aria-label="Breadcrumb navigation">
            <ol class="breadcrumb-trail" id="breadcrumb-trail">
              <!-- Rendered dynamically -->
            </ol>
          </nav>
          <h1 class="page-title" id="view-title" style="display:none;">Collections</h1>
          <span class="badge" id="view-badge" style="display:none;"></span>
          <div style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-muted); margin-left: 0.5rem;">
            <span class="live-dot"></span>
            <span>Realtime Live</span>
          </div>
        </div>
        <div class="top-bar-right-group" style="display: flex; align-items: center; gap: 8px;">
          <!-- Application Switcher -->
          <div class="app-switcher-wrapper" id="app-switcher-wrapper" style="position: relative;">
            <button class="btn btn-secondary btn-sm" id="btn-app-switcher" onclick="toggleAppSwitcher(event)" style="display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; font-weight: 600; font-size: 12px; border-radius: 6px; background: var(--bg-card-hover); border: 1px solid var(--border-subtle); cursor: pointer;" title="Switch Active App">
              <span id="app-switcher-icon">⚡</span>
              <span id="app-switcher-label">Default App</span>
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"></polyline></svg>
            </button>
            <div class="dropdown-menu-popover" id="app-switcher-menu" style="display: none; position: absolute; top: calc(100% + 6px); right: 0; min-width: 220px; z-index: 1000; background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 8px; box-shadow: var(--shadow-dropdown); padding: 4px;">
              <div style="padding: 6px 10px 4px 10px; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted);">Active Application</div>
              <div id="app-switcher-items" style="max-height: 240px; overflow-y: auto;">
                <!-- Populated dynamically -->
              </div>
              <div style="border-top: 1px solid var(--border-subtle); margin: 4px 0;"></div>
              <button class="menu-popover-item" onclick="openCreateAppModal()" style="display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; text-align: left; background: none; border: none; color: var(--accent-primary); cursor: pointer;">
                <span>＋</span>
                <span>Create New App...</span>
              </button>
            </div>
          </div>

          <button class="command-palette-trigger-btn" id="btn-command-palette-trigger" onclick="openCommandPalette()" title="Open Command Palette (Ctrl+K or ⌘K)">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <span>Jump to...</span>
            <kbd class="palette-kbd">⌘K</kbd>
          </button>
          <div class="top-actions" id="view-actions">
            <!-- Dynamic Action Buttons -->
          </div>
        </div>
      </div>

      <!-- Collection Tabs (shown only for collections) -->
      <div class="tabs-bar" id="collection-tabs" style="display:none;">
        <div class="tabs-group" style="display: flex; align-items: center; gap: 1.5rem;">
          <button class="tab-btn active" id="tab-records" onclick="switchCollectionTab('records')">Records Data Grid</button>
          <button class="tab-btn" id="tab-schema" onclick="switchCollectionTab('schema')">Schema & API Rules</button>
        </div>
        <div class="collection-actions-bar" id="collection-actions" style="display: none;"></div>
      </div>

      <!-- Main Body -->
      <div class="content-body" id="main-body">
        <!-- 1. Home / Dashboard Overview Page View -->
        <div id="page-view-home" class="app-page-view" style="display: block;">
          <!-- Injected by renderHomeView() -->
        </div>

        <!-- 2. Dedicated Collections Page View -->
        <div id="page-view-collections" class="app-page-view" style="display: none; height: 100%;">
          <div class="page-layout-master-detail">
            <!-- Submenu Rail: Collections navigation, search, and groups -->
            <aside class="page-submenu-rail" id="collections-submenu-rail" aria-label="Collections sub-navigation">
              <div class="submenu-rail-header">
                <div style="display: flex; align-items: center; justify-content: space-between; width: 100%;">
                  <div style="display: flex; align-items: center; gap: 6px;">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: #60a5fa;"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
                    <span style="font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted);">Collections</span>
                  </div>
                  <div class="dropdown-wrapper">
                    <button class="btn btn-secondary btn-sm" id="btn-collection-new-dropdown" onclick="toggleCollectionCreateMenu(event)" title="Create or import collection" style="padding: 2px 8px; font-size: 11px; display: inline-flex; align-items: center; gap: 4px;">
                      <span>+ New</span>
                      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"></polyline></svg>
                    </button>
                    <div class="dropdown-menu-popover" id="collection-create-menu" style="display: none;">
                      <button class="menu-popover-item" onclick="handleCollectionMenuAction('new')">
                        <span class="popover-icon">➕</span>
                        <div class="popover-text">
                          <div class="popover-title">New Collection</div>
                          <div class="popover-desc">Create blank schema from scratch</div>
                        </div>
                      </button>
                      <button class="menu-popover-item" onclick="handleCollectionMenuAction('templates')">
                        <span class="popover-icon">✨</span>
                        <div class="popover-text">
                          <div class="popover-title">Starter Templates</div>
                          <div class="popover-desc">E-Commerce, Blog, CRM recipes</div>
                        </div>
                      </button>
                      <button class="menu-popover-item" onclick="handleCollectionMenuAction('import')">
                        <span class="popover-icon"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></span>
                        <div class="popover-text">
                          <div class="popover-title">Import JSON</div>
                          <div class="popover-desc">Paste JSON → Instant API schema</div>
                        </div>
                      </button>
                    </div>
                  </div>
                </div>
              </div>

              <!-- Collection Filter -->
              <div class="sidebar-collection-filter" id="sidebar-collection-filter" style="padding: 0 0 0.5rem 0;">
                <div class="collection-filter-inner">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                  </svg>
                  <input 
                    type="text" 
                    id="collection-filter-input" 
                    class="collection-filter-input" 
                    placeholder="Filter collections..." 
                    oninput="handleCollectionFilterInput(this.value)" 
                    autocomplete="off" 
                    spellcheck="false"
                  >
                  <button 
                    type="button" 
                    id="collection-filter-clear-btn" 
                    class="filter-clear-btn" 
                    onclick="clearCollectionFilter()" 
                    title="Clear filter" 
                    style="display:none;"
                  >✕</button>
                </div>
              </div>

              <!-- Categorized Collections List -->
              <div class="collections-list" id="collections-list" style="padding: 0; flex: 1; overflow-y: auto;">
                <!-- Rendered dynamically by renderCollectionsList() -->
              </div>
            </aside>

            <!-- Main Details Area for Collections Page -->
            <section class="page-detail-content" id="collections-detail-pane" style="flex: 1; min-width: 0; display: flex; flex-direction: column; overflow-y: auto;">
              <!-- If collection selected: collection-tabs and records/schema view -->
              <!-- If no collection selected: Collections Hub Overview -->
            </section>
          </div>
        </div>

        <!-- 3. Dedicated Plugins Page View -->
        <div id="page-view-plugins" class="app-page-view" style="display: none; height: 100%;">
          <div class="page-layout-master-detail">
            <!-- Submenu Rail: Installed Plugins list and quick actions -->
            <aside class="page-submenu-rail" id="plugins-submenu-rail" aria-label="Plugins sub-navigation">
              <div class="submenu-rail-header">
                <div style="display: flex; align-items: center; justify-content: space-between; width: 100%;">
                  <div style="display: flex; align-items: center; gap: 6px;">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: #38bdf8;"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                    <span style="font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted);">Installed Plugins</span>
                  </div>
                  <span class="badge badge-primary" id="plugins-rail-count" style="font-size: 10px; padding: 1px 6px;">0</span>
                </div>
              </div>

              <!-- Plugins Navigation Group -->
              <div id="sidebar-plugins-group" style="display: flex; flex-direction: column; gap: 4px; flex: 1; overflow-y: auto;">
                <div id="sidebar-plugin-items" style="display: flex; flex-direction: column; gap: 4px;">
                  <!-- Dynamically populated with nav-stripe, nav-s3-storage, nav-resend, etc. -->
                </div>
              </div>

              <!-- Submenu Rail Footer: Link to OpenAPI Specs -->
              <div style="margin-top: auto; padding-top: 0.75rem; border-top: 1px solid var(--border-subtle); display: flex; flex-direction: column; gap: 4px;">
                <a href="/_/docs" target="_blank" id="plugin-docs-link" onclick="openDocsWithApp(event)" class="sidebar-nav-item" style="text-decoration: none; color: inherit; font-size: 12px; padding: 6px 8px;">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                  <span>OpenAPI Specs</span>
                  <span style="margin-left: auto; font-size: 10px; opacity: 0.6;">↗</span>
                </a>
              </div>
            </aside>

            <!-- Main Details Area for Plugins Page -->
            <section class="page-detail-content" id="plugins-detail-pane" style="flex: 1; min-width: 0; display: flex; flex-direction: column; overflow-y: auto;">
              <!-- If plugin selected: renders plugin view -->
              <!-- If no plugin selected: renders Plugins Hub Overview -->
            </section>
          </div>
        </div>

        <!-- 3.5 Webhooks Page View -->
        <div id="page-view-webhooks" class="app-page-view" style="display: none;"></div>

        <!-- 3.6 Functions Page View -->
        <div id="page-view-functions" class="app-page-view" style="display: none;"></div>

        <!-- 3.7 Functions Flow Page View -->
        <div id="page-view-flows" class="app-page-view" style="display: none; height: 100%;"></div>

        <!-- 4. Analytics & Metrics Page View -->
        <div id="page-view-analytics" class="app-page-view" style="display: none;"></div>

        <!-- 5. Demo Snapshots Page View -->
        <div id="page-view-snapshots" class="app-page-view" style="display: none;"></div>

        <!-- 6. Audit Logs Page View -->
        <div id="page-view-logs" class="app-page-view" style="display: none;"></div>

      </div>
    </main>
  </div>

  <!-- Toast Container -->
  <div id="toast-container"></div>

  <!-- Modals Container -->
  <div id="modal-root"></div>

  <!-- Slide-Over Drawer Container -->
  <div id="drawer-root"></div>

  <!-- Command Palette Container -->
  <div id="command-palette-root"></div>


  <script src="./js/codemirror.js"></script>
  <script src="./js/state.js"></script>
  <script src="./js/theme.js"></script>
