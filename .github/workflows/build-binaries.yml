name: Build & Release Standalone Binaries (SEA)

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish to GitHub Release (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.artifact_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: nodestack-windows-x64.exe
          - os: ubuntu-latest
            artifact_name: nodestack-linux-x64
          - os: macos-latest
            artifact_name: nodestack-macos-arm64
          - os: macos-15-intel
            artifact_name: nodestack-macos-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build server & UI bundle
        run: npm run build:server

      - name: Build SEA Standalone Binary
        run: node scripts/build-sea.js --out ${{ matrix.artifact_name }}

      - name: Verify Binary Execution
        shell: bash
        run: |
          ./dist/${{ matrix.artifact_name }} --version
          ./dist/${{ matrix.artifact_name }} --help

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}
          if-no-files-found: error

  release:
    name: Publish to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' || github.event.inputs.create_release == 'true'
    permissions:
      contents: write
    steps:
      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-binaries
          merge-multiple: true

      - name: List downloaded binaries
        run: ls -lh release-binaries/

      - name: Upload Binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-binaries/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
