name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Build server, client, and plugins
        run: npm run build

      - name: Publish @nodestackapp plugins
        run: node scripts/publish-plugins.js
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
